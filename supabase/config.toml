# Supabase project configuration for Posture.ai (used by the Supabase CLI for
# local development; mirror the [auth] settings in the hosted project's
# dashboard under Authentication – see docs/deploy.md).
project_id = "posture-ai"

[api]
# Only the public schema is exposed through the API; helper functions live in "private".
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
site_url = "https://app.example.com"
additional_redirect_urls = ["http://localhost:8000/"]
# Short-lived access tokens; refresh tokens rotate and are single use.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[functions.ai]
# The platform gateway rejects requests without a valid JWT before the function runs.
verify_jwt = true
