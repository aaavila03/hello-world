name = "riskpilot-intake"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated list of sites allowed to call this worker.
ALLOWED_ORIGINS = "https://aaavila03.github.io"
MODEL = "claude-opus-5-5"

# Per-IP limit on auto-fill requests (counted per Cloudflare location).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4201"

  [ratelimits.simple]
  limit = 3
  period = 60

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   ANTHROPIC_API_KEY  required
#   ACCESS_CODE        optional; when set, vendor links must carry ?code=<value>
